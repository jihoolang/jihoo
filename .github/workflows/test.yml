# Builds the toolchain with Nix and runs every test: `nix flake check`
# bootstraps the compiler from the released seed (stage 1, then stage 2, which
# must write the same IR), runs tests/runner.jh with it, and builds and runs
# the examples with the packaged toolchain, on x86_64 and aarch64 Linux.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: flake-check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nix flake check
        run: nix flake check -L
