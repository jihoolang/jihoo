# Builds the toolchain with Nix and runs the compiler tests: `nix flake check`
# bootstraps the compiler from the released seed (stage 1, then stage 2, which
# must write the same IR), runs tests/runner.jh with it, and builds and runs
# the examples with the packaged toolchain, on x86_64 and aarch64 Linux.
# Deterministic experiment regressions then run with the packaged compiler.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      horn_differential:
        description: Also compare the proof checkers with the pinned Horn reference
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: flake-check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nix flake check
        run: nix flake check -L
      - name: Experiment regression tests
        run: |
          nix build .#jihoo
          nix develop --command python3 scripts/check-experiments.py --compiler ./result/bin/jihoo
      - name: Preserve experiment reports and failing inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: experiments-${{ matrix.system }}
          path: |
            out/experiments/report.json
            out/kernel
            out/proofs
            out/verified-codec
            out/functional-fusion/results
          if-no-files-found: ignore

  horn-differential:
    if: github.event_name == 'workflow_dispatch' && inputs.horn_differential
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: jihoo12/horn
          ref: 18caf6d39088e1569beff678bc4461a28b8d2827
          path: out/horn
      - uses: cachix/install-nix-action@v31
      - name: Compare experiment checkers with Horn
        run: |
          nix build .#jihoo
          nix develop .#differential --command python3 scripts/check-experiments.py --compiler ./result/bin/jihoo --horn out/horn --horn-revision 18caf6d39088e1569beff678bc4461a28b8d2827
      - name: Preserve differential reports and failing inputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: experiments-horn-differential
          path: |
            out/experiments/report.json
            out/kernel
            out/proofs
          if-no-files-found: ignore
