# Builds the toolchain with Nix and runs the compiler tests: `nix flake check`
# bootstraps the compiler from the released seed (stage 1, then stage 2, which
# must write the same IR), runs tests/runner.jh with it, and builds and runs
# the examples with the packaged toolchain, on x86_64 and aarch64 Linux.
# The fusion benchmark's deterministic checks and the compilation workloads'
# structural checks (scripts/benchmark_compile.py --check-only) then run with
# the packaged compiler.
name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: flake-check (${{ matrix.system }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: nix flake check
        run: nix flake check -L
      - name: Fusion benchmark checks
        run: |
          nix build .#jihoo
          nix develop --command python3 benchmarks/functional-fusion/run.py --check-only --compiler ./result/bin/jihoo
      - name: Preserve fusion reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: functional-fusion-${{ matrix.system }}
          path: out/functional-fusion/results
          if-no-files-found: ignore
      - name: Compilation baseline checks
        run: nix develop --command python3 scripts/benchmark_compile.py --check-only --target x86_64 --target aarch64 --compiler ./result/bin/jihoo --json out/compile/check.json
      - name: Preserve compilation measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: compile-${{ matrix.system }}
          path: out/compile
          if-no-files-found: ignore
