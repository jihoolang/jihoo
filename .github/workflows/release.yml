# Package and smoke-test both native Linux archives before publishing either.
# Archives require glibc and LLVM 21 (libLLVM-21.so, clang, ld.lld).
# Existing release assets are never replaced: flake.nix pins the seed's hash.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to build and test"
        required: true
      publish:
        description: "Publish after both architectures pass (existing assets are never replaced)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: build and smoke (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            loader: /lib64/ld-linux-x86-64.so.2
          - arch: aarch64
            runner: ubuntu-24.04-arm
            loader: /lib/ld-linux-aarch64.so.1
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: validate tag
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: nix build
        run: nix build -L .#jihoo
      - name: package
        run: |
          name="jihoo-$TAG-${{ matrix.arch }}-linux"
          mkdir -p "$name/bin" "$name/share/jihoo"
          # The compiler itself, not the Nix wrapper that sets its paths.
          install -m755 result/bin/.jihoo-wrapped "$name/bin/jihoo"
          nix shell --inputs-from . nixpkgs#patchelf -c patchelf \
            --set-interpreter '${{ matrix.loader }}' --remove-rpath "$name/bin/jihoo"
          cp -r result/share/jihoo/lib "$name/share/jihoo/lib"
          chmod -R u+w "$name"
          cp LICENSE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - name: smoke-test the archive
        timeout-minutes: 10
        run: |
          # Test the system loader and bundled modules first. Code generation
          # then uses the pinned Nix runtime: its LLVM can require a newer glibc
          # than Ubuntu. This does not certify a distribution LLVM installation.
          name="jihoo-$TAG-${{ matrix.arch }}-linux"
          sha256sum -c "$name.tar.gz.sha256"
          smoke=$(mktemp -d)
          trap 'rm -rf "$smoke"' EXIT
          tar -xzf "$name.tar.gz" -C "$smoke"
          mkdir "$smoke/work"
          cd "$smoke/work"
          cat > hello.jh <<'JIHOO'
          import std.libc
          fn main() {
              println("Hello, jihoo!")
          }
          JIHOO
          cat > freestanding.jh <<'JIHOO'
          #![freestanding]
          fn main() {
              println("Hello, jihoo!")
          }
          JIHOO
          # shellcheck disable=SC2016
          env -i HOME="$PWD" PATH=/usr/bin:/bin /bin/bash -euo pipefail -c '
            test "$("$1" --version)" = "jihoo $2"
            "$1" check hello.jh
          ' smoke "$smoke/$name/bin/jihoo" "${TAG#v}"
          # shellcheck disable=SC2016
          runtime=$(nix eval --raw --impure --expr '
            let f = builtins.getFlake (builtins.getEnv "GITHUB_WORKSPACE");
            in f.inputs.nixpkgs.legacyPackages.${builtins.currentSystem}.glibc.outPath')
          loader="$runtime/lib/$(basename '${{ matrix.loader }}')"
          test -x "$loader"
          # The shell is resolved from the source flake, but the test's cwd
          # and source files are outside it. The first check has no path overrides.
          # Variables in the quoted scripts expand in their child shells.
          # shellcheck disable=SC2016
          nix shell --inputs-from "$GITHUB_WORKSPACE" \
            nixpkgs#llvmPackages_21.clang nixpkgs#llvmPackages_21.lld \
            nixpkgs#llvmPackages_21.llvm.dev -c bash -euo pipefail -c '
              compiler=$1
              expected=$2
              loader=$3
              # Explicit loader changes executable discovery; use only shipped modules.
              env -i HOME="$PWD" PATH="$PATH" \
                JIHOO_PATH="$(dirname "$compiler")/../share/jihoo/lib" \
                JIHOO_CC="$(command -v clang)" \
                JIHOO_LD="$(command -v ld.lld)" \
                JIHOO_LLVM="$(llvm-config --libdir)/libLLVM-21.so" \
                bash -euo pipefail -c '\''
                  compiler=$1
                  loader=$3
                  run_compiler() { "$loader" "$compiler" "$@"; }
                  test "$("$compiler" --version)" = "jihoo $2"
                  "$compiler" check hello.jh
                  run_compiler run hello.jh > run.out
                  printf "Hello, jihoo!\n" > expected.out
                  cmp expected.out run.out
                  run_compiler build hello.jh -o hello
                  ./hello > build.out
                  cmp expected.out build.out
                  run_compiler build freestanding.jh -o freestanding
                  ./freestanding > freestanding.out
                  cmp expected.out freestanding.out
                '\'' smoke "$compiler" "$expected" "$loader"
            ' smoke "$smoke/$name/bin/jihoo" "${TAG#v}" "$loader"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: jihoo-*.tar.gz*
          if-no-files-found: error

  publish:
    # A failed/skipped matrix member prevents any release upload.
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - name: upload tested archives
        run: |
          sha256sum -c jihoo-*.tar.gz.sha256
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "jihoo $TAG" --notes "jihoo $TAG"
          # Deliberately no --clobber: seed archives are immutable.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" jihoo-*.tar.gz*
