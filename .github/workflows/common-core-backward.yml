name: Common Core backward proofs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backward-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - name: Check backward simulation and dedicated axiom audit
        run: nix develop .#checks.x86_64-linux.lean-proofs --command bash proofs/check-common-core-backward.sh
      - name: Check executable boxed Tree Drop and axiom audit
        run: nix develop .#checks.x86_64-linux.lean-proofs --command bash proofs/check-common-data-reference-drop.sh
      - name: Check fixed binary Tree Drop CFG and axiom audit
        run: nix develop .#checks.x86_64-linux.lean-proofs --command bash proofs/check-tree-drop-cfg.sh
      - name: Check Tree constructor prefixes, relocation and axiom audits
        run: nix develop .#checks.x86_64-linux.lean-proofs --command bash proofs/check-tree-create-relocation.sh
      - name: Check independent Case CFG entry, relocation and axiom audit
        run: nix develop .#checks.x86_64-linux.lean-proofs --command bash proofs/check-common-data-case.sh
      - name: Check executed Case entry context and axiom audit
        run: nix develop .#checks.x86_64-linux.lean-proofs --command bash proofs/check-common-data-case-entry-context.sh
      - name: Check Tree constructor common context and axiom audit
        run: nix develop .#checks.x86_64-linux.lean-proofs --command bash proofs/check-tree-create-context.sh
